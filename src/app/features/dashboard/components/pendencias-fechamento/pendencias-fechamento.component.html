@if (pendencias().length) {
  <section class="rounded-xl border border-amber-300 bg-amber-50 p-4 text-amber-950" aria-labelledby="titulo-pendencias-fechamento">
    <h3 id="titulo-pendencias-fechamento" class="text-sm font-bold">{{ titulo() }}</h3>
    <ul class="mt-2 flex flex-wrap gap-2">
      @for (pendencia of pendencias(); track pendencia.data + pendencia.tipoRefeicaoId) {
        <li>
          <a class="inline-flex rounded-lg border border-amber-300 bg-white px-2.5 py-1 text-xs font-semibold text-amber-900 hover:bg-amber-100 focus:outline-none focus:ring-2 focus:ring-amber-500/40"
             routerLink="/fechamento"
             [queryParams]="{ data: pendencia.data, refeicao: pendencia.tipoRefeicaoId }">
            {{ diaMes(pendencia.data) }} • {{ pendencia.refeicao }}
          </a>
        </li>
      }
    </ul>
  </section>
}
