<dialog
  #dialog
  autofocus
  class="m-auto max-h-[calc(100dvh-1rem)] w-[calc(100vw-1rem)] overflow-visible bg-transparent p-0 text-slate-900 backdrop:bg-slate-900/50 sm:max-h-[calc(100dvh-3rem)]"
  [class]="largura() === 'lg' ? 'sm:max-w-4xl' : 'sm:max-w-2xl'"
  [attr.aria-labelledby]="tituloId"
  (cancel)="aoCancelar($event)"
  (mousedown)="aoPressionar($event)"
  (click)="aoClicar($event)"
>
  <div class="flex max-h-[inherit] flex-col rounded-2xl border border-slate-200 bg-surface-card shadow-2xl">
    <header class="flex items-start justify-between gap-4 border-b border-slate-200 px-5 py-4 sm:px-6">
      <h2 [id]="tituloId" class="text-lg font-extrabold text-slate-900">{{ titulo() }}</h2>
      <button
        type="button"
        class="-mr-2 -mt-1 rounded-lg p-2 text-slate-500 transition-colors hover:bg-slate-100 hover:text-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-300"
        aria-label="Fechar"
        (click)="fechar.emit()"
      >
        <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M5.3 5.3a1 1 0 0 1 1.4 0L10 8.6l3.3-3.3a1 1 0 1 1 1.4 1.4L11.4 10l3.3 3.3a1 1 0 0 1-1.4 1.4L10 11.4l-3.3 3.3a1 1 0 0 1-1.4-1.4L8.6 10 5.3 6.7a1 1 0 0 1 0-1.4z"/></svg>
      </button>
    </header>
    <div class="overflow-y-auto px-5 py-5 sm:px-6">
      <ng-content />
    </div>
  </div>
</dialog>
