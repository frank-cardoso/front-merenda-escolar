<section class="rounded-2xl p-8 text-center text-white"
         [class.bg-emerald-600]="resultado().sinal === 'VERDE'"
         [class.bg-red-600]="resultado().sinal === 'VERMELHO'"
         role="status" aria-live="assertive">
  <p class="text-sm font-bold uppercase tracking-[0.3em]">{{ resultado().resultado }}</p>
  <h2 class="mt-3 text-4xl font-black">{{ resultado().alunoNome || 'Aluno nao identificado' }}</h2>
  <p class="mt-3 text-lg">{{ resultado().motivo || resultado().cardapio }}</p>
</section>
