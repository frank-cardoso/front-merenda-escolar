<div class="overflow-hidden rounded-2xl border border-slate-200 bg-surface-card shadow-sm">
  <div class="p-4 pb-2 sm:p-6 sm:pb-2">
    <div class="relative min-h-[280px] overflow-hidden rounded-xl border border-slate-800 bg-slate-950 text-white shadow-inner">
      <video #video class="h-full w-full object-cover" [class.hidden]="estado() !== 'ativa'" muted playsinline></video>

      @if (estado() !== 'ativa') {
        <div class="absolute inset-0 flex flex-col items-center justify-center gap-4 bg-slate-950 px-6 text-center">
          <div class="grid size-16 place-items-center rounded-xl border border-brand-500/40 bg-brand-500/10">
            <svg class="size-7 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
              <circle cx="12" cy="13" r="3.5" stroke-width="2"></circle>
            </svg>
          </div>
          <div>
            <p class="text-lg font-bold tracking-tight">Câmera facial</p>
            <p class="mt-1 max-w-md text-sm text-slate-300">{{ mensagem() }}</p>
          </div>
        </div>
      }
    </div>
  </div>

  <div class="grid gap-3 border-t border-slate-100 bg-slate-50/60 p-4 sm:grid-cols-[1fr_auto_auto] sm:items-center sm:p-6 sm:pt-4">
    <p class="flex items-center gap-2 text-sm text-slate-600">
      <svg class="size-5 shrink-0 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
      </svg>
      <span>{{ mensagem() }}</span>
    </p>

    @if (estado() === 'ativa') {
      <button type="button"
        class="rounded-lg bg-brand-500 px-5 py-2.5 text-sm font-bold text-zinc-950 shadow-sm hover:bg-brand-400 focus:outline-none focus:ring-2 focus:ring-brand-300"
        (click)="capturar()">
        Capturar foto
      </button>
      <button type="button"
        class="rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 shadow-sm hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-brand-300"
        (click)="pararCamera()">
        Parar câmera
      </button>
    } @else {
      <button type="button"
        class="rounded-lg border border-zinc-700 bg-zinc-900 px-5 py-2.5 text-sm font-bold text-brand-400 shadow-sm hover:bg-black focus:outline-none focus:ring-2 focus:ring-brand-300 disabled:cursor-not-allowed disabled:border-slate-300 disabled:bg-slate-300 disabled:text-slate-500 sm:col-span-2"
        [disabled]="estado() === 'carregando'"
        (click)="iniciarCamera()">
        {{ estado() === 'carregando' ? 'Aguarde...' : 'Iniciar câmera' }}
      </button>
    }
  </div>

  @if (ultimaFoto(); as foto) {
    <div class="flex items-center gap-3 border-t border-slate-100 p-4 sm:p-6">
      <img [src]="foto" alt="Última foto capturada" class="h-16 w-16 rounded-lg border border-slate-200 object-cover" />
      <span class="text-xs text-slate-500">Última foto capturada.</span>
    </div>
  }
</div>
