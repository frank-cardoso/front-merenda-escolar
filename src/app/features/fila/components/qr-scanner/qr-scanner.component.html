<div class="overflow-hidden rounded-2xl border border-slate-200 bg-surface-card shadow-sm">
  <div class="p-4 pb-2 sm:p-6 sm:pb-2">
    <div class="relative min-h-[320px] overflow-hidden rounded-xl border border-slate-800 bg-slate-950 text-white shadow-inner">
      <div [id]="scannerId" class="absolute inset-0 overflow-hidden"></div>

      @if (estado() !== 'lendo') {
        <div class="absolute inset-0 flex flex-col items-center justify-center gap-4 bg-slate-950 px-6 text-center">
          <div class="grid size-16 place-items-center rounded-xl border border-brand-500/40 bg-brand-500/10">
            <span class="text-2xl font-extrabold tracking-tighter text-brand-400">QR</span>
          </div>
          <div>
            <p class="text-lg font-bold tracking-tight">Leitor de QR Code</p>
            <p class="mt-1 max-w-md text-sm text-slate-300">{{ mensagem() }}</p>
          </div>
        </div>
      }

      @if (estado() === 'lendo') {
        <div class="pointer-events-none absolute inset-0 grid place-items-center">
          <div class="size-60 rounded-lg border-2 border-brand-400 shadow-[0_0_0_999px_rgba(2,6,23,0.45)]"></div>
        </div>
        <div class="absolute inset-x-4 bottom-4 rounded-md bg-slate-950/80 px-4 py-3 text-sm font-medium text-slate-100">
          {{ mensagem() }}
        </div>
      }
    </div>
  </div>

  <div class="grid gap-3 border-t border-slate-100 bg-slate-50/60 p-4 sm:grid-cols-[1fr_auto_auto] sm:items-center sm:p-6 sm:pt-4">
    <p class="flex items-center gap-2 text-sm text-slate-600">
      <svg class="size-5 shrink-0 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
      </svg>
      <span>{{ mensagem() }}</span>
    </p>

    @if (estado() === 'lendo') {
      <button
        type="button"
        class="rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 shadow-sm hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-brand-300"
        (click)="pararCamera()"
      >
        Parar câmera
      </button>
    } @else {
      <button
        type="button"
        class="rounded-lg border border-zinc-700 bg-zinc-900 px-5 py-2.5 text-sm font-bold text-brand-400 shadow-sm hover:bg-black focus:outline-none focus:ring-2 focus:ring-brand-300 disabled:cursor-not-allowed disabled:border-slate-300 disabled:bg-slate-300 disabled:text-slate-500"
        [disabled]="estado() === 'carregando'"
        (click)="iniciarCamera()"
      >
        {{ estado() === 'carregando' ? 'Aguarde...' : 'Iniciar câmera' }}
      </button>
    }

    <label class="cursor-pointer rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-center text-sm font-semibold text-slate-700 shadow-sm hover:bg-slate-50 focus-within:ring-2 focus-within:ring-brand-300">
      Ler imagem
      <input type="file" accept="image/*" class="sr-only" (change)="lerArquivo($event)" />
    </label>
  </div>
</div>
