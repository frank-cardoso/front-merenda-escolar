<form class="space-y-5" (ngSubmit)="enviar()">
  <div class="grid gap-4 sm:grid-cols-2">
    <label class="text-sm font-semibold text-slate-700">
      Data
      <input
        type="date"
        name="data"
        class="mt-1 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-normal text-slate-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-200"
        [ngModel]="data()"
        (ngModelChange)="data.set($event)"
      />
    </label>

    <label class="text-sm font-semibold text-slate-700">
      Turno
      <select
        name="turno"
        class="mt-1 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-normal text-slate-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-200"
        [ngModel]="turno()"
        (ngModelChange)="turno.set($event)"
      >
        @for (item of turnos; track item) {
          <option [value]="item">{{ item }}</option>
        }
      </select>
    </label>

    <label class="text-sm font-semibold text-slate-700">
      Refeição
      <input
        type="text"
        name="nomeRefeicao"
        placeholder="Ex.: Almoço completo"
        class="mt-1 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-normal text-slate-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-200"
        [ngModel]="nomeRefeicao()"
        (ngModelChange)="nomeRefeicao.set($event)"
      />
    </label>

    <label class="text-sm font-semibold text-slate-700">
      Quantidade planejada
      <input
        type="number"
        name="quantidadePlanejada"
        min="0"
        class="mt-1 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-normal text-slate-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-200"
        [ngModel]="quantidadePlanejada()"
        (ngModelChange)="quantidadePlanejada.set($event)"
      />
    </label>
  </div>

  <label class="block text-sm font-semibold text-slate-700">
    Descrição
    <textarea
      name="descricao"
      rows="2"
      placeholder="Observações sobre o cardápio (opcional)"
      class="mt-1 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-normal text-slate-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-200"
      [ngModel]="descricao()"
      (ngModelChange)="descricao.set($event)"
    ></textarea>
  </label>

  <div class="space-y-3">
    <div class="flex items-center justify-between">
      <p class="text-sm font-semibold text-slate-700">Itens do cardápio</p>
      <button
        type="button"
        class="rounded-lg border border-brand-300 bg-brand-50 px-3 py-1 text-sm font-bold text-brand-800 hover:bg-brand-100"
        (click)="adicionarItem()"
      >
        + Adicionar item
      </button>
    </div>

    @for (item of itens(); track $index) {
      <div class="grid gap-2 sm:grid-cols-[1fr_180px_auto]">
        <select
          [name]="'item-receita-' + $index"
          class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-normal text-slate-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-200"
          [ngModel]="item.receitaId"
          (ngModelChange)="selecionarReceita($index, $event)"
        >
          <option [ngValue]="null">Selecione a receita</option>
          @for (receita of receitas(); track receita.id) {
            <option [ngValue]="receita.id">{{ receita.nome }}</option>
          }
        </select>
        <input
          type="text"
          [name]="'item-quantidade-' + $index"
          placeholder="Quantidade (ex.: 10 kg)"
          class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-normal text-slate-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-200"
          [ngModel]="item.quantidade"
          (ngModelChange)="atualizarQuantidade($index, $event)"
        />
        <button
          type="button"
          class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-normal text-slate-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-200 font-semibold text-slate-600 hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-40"
          [disabled]="itens().length === 1"
          (click)="removerItem($index)"
        >
          Remover
        </button>
      </div>
    }
  </div>

  <div class="flex justify-end gap-3">
    <button
      type="button"
      class="rounded-lg border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50"
      (click)="cancelar.emit()"
    >
      Cancelar
    </button>
    <button
      type="submit"
      class="rounded-lg bg-brand-500 px-4 py-2 text-sm font-bold text-zinc-950 shadow-sm transition-colors hover:bg-brand-400 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400"
      [disabled]="!formularioValido() || salvando()"
    >
      {{ salvando() ? 'Salvando...' : 'Salvar cardápio' }}
    </button>
  </div>
</form>
