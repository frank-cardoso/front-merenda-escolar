<section class="rounded-2xl border-2 p-8 text-center shadow-sm"
         [class.border-emerald-300]="resultado().sinal === 'VERDE'"
         [class.bg-emerald-50]="resultado().sinal === 'VERDE'"
         [class.text-emerald-950]="resultado().sinal === 'VERDE'"
         [class.border-red-300]="resultado().sinal === 'VERMELHO'"
         [class.bg-red-50]="resultado().sinal === 'VERMELHO'"
         [class.text-red-950]="resultado().sinal === 'VERMELHO'"
         role="status" aria-live="assertive">
  <div class="mx-auto grid size-14 place-items-center rounded-full text-white"
       [class.bg-emerald-600]="resultado().sinal === 'VERDE'"
       [class.bg-red-600]="resultado().sinal === 'VERMELHO'"
       aria-hidden="true">
    @if (resultado().resultado === 'AUTORIZADO') {
      <svg class="size-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path></svg>
    } @else {
      <svg class="size-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path></svg>
    }
  </div>
  <p class="mt-4 text-sm font-extrabold uppercase tracking-[0.3em]">{{ resultado().resultado }}</p>
  <h2 class="mt-3 text-4xl font-black tracking-tight">{{ resultado().alunoNome || 'Aluno não identificado' }}</h2>
  <p class="mt-3 text-lg font-semibold">{{ motivoLegivel() || resultado().cardapio }}</p>
  @if (resultado().motivo && motivoLegivel() !== resultado().motivo) {
    <p class="mt-2 font-mono text-xs opacity-70">{{ resultado().motivo }}</p>
  }
</section>
