<form class="space-y-5 rounded-lg border border-slate-200 bg-white p-6 shadow-sm" (ngSubmit)="enviar()">
  <div class="flex items-center justify-between">
    <h3 class="text-lg font-bold text-slate-900">
      {{ editando() ? 'Editar cardapio' : 'Novo cardapio' }}
    </h3>
    <button
      type="button"
      class="text-sm font-semibold text-slate-500 hover:text-slate-800"
      (click)="cancelar.emit()"
    >
      Fechar
    </button>
  </div>

  <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
    <label class="text-sm font-semibold text-slate-700">
      Data
      <input
        type="date"
        name="data"
        class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm"
        [ngModel]="data()"
        (ngModelChange)="data.set($event)"
      />
    </label>

    <label class="text-sm font-semibold text-slate-700">
      Turno
      <select
        name="turno"
        class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm"
        [ngModel]="turno()"
        (ngModelChange)="turno.set($event)"
      >
        @for (item of turnos; track item) {
          <option [value]="item">{{ item }}</option>
        }
      </select>
    </label>

    <label class="text-sm font-semibold text-slate-700">
      Refeicao
      <input
        type="text"
        name="nomeRefeicao"
        placeholder="Ex.: Almoco completo"
        class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm"
        [ngModel]="nomeRefeicao()"
        (ngModelChange)="nomeRefeicao.set($event)"
      />
    </label>

    <label class="text-sm font-semibold text-slate-700">
      Quantidade planejada
      <input
        type="number"
        name="quantidadePlanejada"
        min="0"
        class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm"
        [ngModel]="quantidadePlanejada()"
        (ngModelChange)="quantidadePlanejada.set($event)"
      />
    </label>
  </div>

  <label class="block text-sm font-semibold text-slate-700">
    Descricao
    <textarea
      name="descricao"
      rows="2"
      placeholder="Observacoes sobre o cardapio (opcional)"
      class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm"
      [ngModel]="descricao()"
      (ngModelChange)="descricao.set($event)"
    ></textarea>
  </label>

  <div class="space-y-3">
    <div class="flex items-center justify-between">
      <p class="text-sm font-semibold text-slate-700">Itens do cardapio</p>
      <button
        type="button"
        class="rounded-md border border-emerald-700 px-3 py-1 text-sm font-semibold text-emerald-800 hover:bg-emerald-50"
        (click)="adicionarItem()"
      >
        + Adicionar item
      </button>
    </div>

    @for (item of itens(); track $index) {
      <div class="grid gap-2 sm:grid-cols-[1fr_180px_auto]">
        <input
          type="text"
          [name]="'item-nome-' + $index"
          placeholder="Nome do item (ex.: arroz)"
          class="rounded-md border border-slate-300 px-3 py-2 text-sm"
          [ngModel]="item.nome"
          (ngModelChange)="atualizarItem($index, 'nome', $event)"
        />
        <input
          type="text"
          [name]="'item-quantidade-' + $index"
          placeholder="Quantidade (ex.: 10 kg)"
          class="rounded-md border border-slate-300 px-3 py-2 text-sm"
          [ngModel]="item.quantidade"
          (ngModelChange)="atualizarItem($index, 'quantidade', $event)"
        />
        <button
          type="button"
          class="rounded-md border border-slate-300 px-3 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-40"
          [disabled]="itens().length === 1"
          (click)="removerItem($index)"
        >
          Remover
        </button>
      </div>
    }
  </div>

  <div class="flex justify-end gap-3">
    <button
      type="button"
      class="rounded-md border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-700"
      (click)="cancelar.emit()"
    >
      Cancelar
    </button>
    <button
      type="submit"
      class="rounded-md bg-emerald-700 px-4 py-2 text-sm font-semibold text-white shadow-sm disabled:cursor-not-allowed disabled:bg-slate-300"
      [disabled]="!formularioValido() || salvando()"
    >
      {{ salvando() ? 'Salvando...' : 'Salvar cardapio' }}
    </button>
  </div>
</form>
