<div class="overflow-hidden rounded-lg border border-slate-200 bg-slate-950 text-white shadow-sm">
  <div class="relative min-h-[320px] bg-slate-900">
    <div [id]="scannerId" class="absolute inset-0 overflow-hidden"></div>

    @if (estado() !== 'lendo') {
      <div class="absolute inset-0 flex flex-col items-center justify-center gap-5 bg-slate-950 px-6 text-center">
        <div class="grid size-20 place-items-center rounded-lg border border-emerald-400/30 bg-emerald-400/10">
          <span class="text-4xl font-black text-emerald-300">QR</span>
        </div>
        <div>
          <p class="text-lg font-bold">Leitor de QR Code</p>
          <p class="mt-2 max-w-md text-sm text-slate-300">{{ mensagem() }}</p>
        </div>
      </div>
    }

    @if (estado() === 'lendo') {
      <div class="pointer-events-none absolute inset-0 grid place-items-center">
        <div class="size-60 rounded-lg border-2 border-emerald-300 shadow-[0_0_0_999px_rgba(2,6,23,0.45)]"></div>
      </div>
      <div class="absolute inset-x-4 bottom-4 rounded-md bg-slate-950/80 px-4 py-3 text-sm font-medium text-slate-100">
        {{ mensagem() }}
      </div>
    }
  </div>

  <div class="grid gap-3 border-t border-white/10 bg-white p-4 text-slate-900 sm:grid-cols-[1fr_auto_auto] sm:items-center">
    <p class="text-sm font-medium text-slate-600">{{ mensagem() }}</p>

    @if (estado() === 'lendo') {
      <button
        type="button"
        class="rounded-md border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50"
        (click)="pararCamera()"
      >
        Parar camera
      </button>
    } @else {
      <button
        type="button"
        class="rounded-md bg-emerald-700 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-emerald-800 disabled:cursor-not-allowed disabled:bg-slate-300"
        [disabled]="estado() === 'carregando'"
        (click)="iniciarCamera()"
      >
        {{ estado() === 'carregando' ? 'Aguarde...' : 'Iniciar camera' }}
      </button>
    }

    <label class="cursor-pointer rounded-md border border-slate-300 px-4 py-2 text-center text-sm font-semibold text-slate-700 hover:bg-slate-50">
      Ler imagem
      <input type="file" accept="image/*" class="sr-only" (change)="lerArquivo($event)" />
    </label>
  </div>
</div>
